# CertPouch v2 server.yaml. Every server command reads this one file:
# server, pipeline, dns fetch|sync|diff|apply and cert publish|renew|status.
# Add sections as you need them; create the parent directories first.

# 1. Inventory: where host names and IPv4 addresses come from.
inventory:
  cache_file: "/var/lib/certpouch/inventory.json"
  # Instead of cache_file, per-sheet CSV exports can be used (no Sheets fetch):
  # csv_files: ["/var/lib/certpouch/servers.csv"]
  fallback_prefix: "192.0.2"
  poll_interval: "3m"
  max_age: "30m"
  sheets:
    spreadsheet_id: "REPLACE_WITH_SPREADSHEET_ID"
    ranges:
      - "'Servers'!A2:G256"
      - "'Containers'!A2:G128"
    credentials_file: "/etc/certpouch/secrets/sheets.json"

# 2. DNS: zone generation and the managed NSD.
dns:
  zone: "example.internal"
  zones:
    primary: "ns1.example.net"
    mailbox: "hostmaster.example.internal"
    nameservers: ["ns1.example.net"]
    reverse_zones: ["2.0.192.in-addr.arpa"]
    ttl: 300
    # No serial here: the first candidate uses dns sync --serial N, later ones
    # advance the serial NSD serves. A dry run without a serial uses 1.
    refresh: 3600
    retry: 600
    expire: 604800
    negative_ttl: 300
  nsd:
    config_file: "/etc/nsd/nsd.conf"
    include_file: "/etc/nsd/certpouch-zones.conf"
    stage_dir: "/var/lib/certpouch/dns-staging"
    zone_dir: "/var/lib/certpouch/nsd-zones"
    dns_address: "127.0.0.1:53"

# 3. Certificates: the existing CA, storage, and which names to issue.
certificates:
  issuer:
    certificate_file: "/etc/certpouch/ca/issuer.pem"
    # Required only on the host that signs (pipeline, cert renew).
    private_key_file: "/etc/certpouch/secrets/issuer.key"
    chain_file: "/etc/certpouch/ca/chain.pem"
  trust_ca_file: "/etc/certpouch/ca/roots.pem"
  store_dir: "/var/lib/certpouch/certificates"
  validity: "720h"
  renew_before: "168h"
  # Without targets, every inventory name and alias gets its own certificate.
  # List targets only to manage a fixed set of names instead, for example
  # certificates issued elsewhere and registered with cert publish:
  # targets:
  #   - name: "web.example.internal"
  #     expected_dns_sans: ["web.example.internal", "portal.example.internal"]
  #     # validity: "2160h"   # per-target override; needs issuer.private_key_file
  #     # renew_before: "720h"

# 4. Distribution: the HTTPS API that pull clients use.
distribution:
  # Default for all clients. Each client can override this with its own auth.
  auth: "token"
  listen: "192.0.2.53:8443"
  refresh_interval: "5s"
  tls:
    certificate_file: "/etc/certpouch/tls/server.pem"
    private_key_file: "/etc/certpouch/tls/server.key"
    # Optional mTLS: require a trusted client certificate on each connection.
    # client_ca: "/etc/certpouch/tls/client-ca.pem"
  # Optional deny-only list, reloaded every 5s by default.
  # revocation_file: "/etc/certpouch/revocations.yaml"
  clients:
    - id: "web-server-01"
      enabled: true
      # auth: "ip" # Uses exact source IP matching. Omit token_hash_file.
      # auth: "mtls" # Needs tls.client_ca and a fingerprint. Omit token_hash_file.
      token_hash_file: "/etc/certpouch/tokens/web-server-01.sha256"
      # With mTLS, one or more lowercase SHA-256 leaf fingerprints:
      # client_certificate_sha256: ["<64 lowercase hex digits>"]
      # Also allow another inventory host to fetch a certificate:
      # certificate_access_overrides:
      #   web.example.internal: ["backup.pvt.example.internal"]
