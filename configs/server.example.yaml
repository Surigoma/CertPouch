server:
  listen: "127.0.0.1:8443"
  publication_refresh: "1m"
  inventory_refresh: "1m"
  tls:
    certificate: "/etc/certpouch/server.crt"
    private_key: "/etc/certpouch/server.key"
storage:
  certificate_dir: "/var/lib/certpouch/certificates"
  trust_ca_file: "/etc/certpouch/issuers.pem"
dns_inventory:
  cache_file: "/var/lib/dns-inventory/cache.json"
  # Optional, when the cache is maintained by certpouch dns fetch:
  # max_age: "45m"
  fallback_prefix: "192.0.2"
  zone: "example.internal"
certificates:
  - name: "web.example.internal"
    expected_dns_sans: ["web.example.internal"]
    expected_ip_sans: []
    issuer_certificate: "/etc/certpouch/intermediate.crt"
clients:
  - id: "web-server-01"
    enabled: true
    token_hash_file: "/etc/certpouch/credentials/web-server-01.sha256"
    # Optional. Permit this inventory host in addition to the certificate's own address.
    # certificate_access_overrides:
    #   web.example.internal: ["backup.pvt.example.internal"]
