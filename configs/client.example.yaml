server:
  url: "https://cert-server.example.internal:8443"
  ca_file: "/etc/ssl/certpouch/server-ca.crt"
client:
  id: "web-server-01"
  auth: "token" # Match the server client entry. For ip or mtls, omit token_file.
  token_file: "/etc/certpouch/client.token"
  # Supply both paths if the distribution server requires mTLS.
  # tls_certificate: "/etc/certpouch/client.crt"
  # tls_private_key: "/etc/certpouch/client.key"
validation:
  trust_ca_file: "/etc/ssl/certpouch/issuers.pem"
  issuer_certificate: "/etc/ssl/certpouch/intermediate.crt"
certificates:
  - name: "web.example.internal"
    destination: "/etc/certpouch/certificates/web.example.internal"
    # DNS SANは既定でname。追加名・IPや別Issuerが必要な場合だけ個別に設定する。
    service:
      unit: "nginx.service"
      action: "reload"
      # Optionally verify the leaf certificate presented by the service.
      # verify_tls:
      #   address: "127.0.0.1:443"
      #   server_name: "web.example.internal"
      #   timeout: "15s"
    # For Docker or another local command, replace the service block with:
    # command:
    #   args: ["/usr/bin/docker", "restart", "web"]
    #   timeout: "1m"
    #   verify_tls:
    #     address: "127.0.0.1:443"
    #     server_name: "web.example.internal"
