# Create the cache, stage, zone and publication parent directories first.
inventory:
  cache_file: "/var/lib/certpouch/inventory.json"
  fallback_prefix: "192.0.2"
  poll_interval: "3m"
  sheets:
    spreadsheet_id: "REPLACE_WITH_SPREADSHEET_ID"
    ranges:
      - "'Servers'!A2:G256"
      - "'Containers'!A2:G128"
    credentials_file: "/etc/certpouch/secrets/sheets.json"
dns:
  zone: "example.internal"
  zones:
    primary: "ns1.example.net"
    mailbox: "hostmaster.example.internal"
    nameservers: ["ns1.example.net"]
    reverse_zones: ["2.0.192.in-addr.arpa"]
    ttl: 300
    refresh: 3600
    retry: 600
    expire: 604800
    negative_ttl: 300
  nsd:
    config_file: "/etc/nsd/nsd.conf"
    include_file: "/etc/nsd/certpouch-zones.conf"
    stage_dir: "/var/lib/certpouch/dns-staging"
    zone_dir: "/var/lib/certpouch/nsd-zones"
    dns_address: "127.0.0.1:53"
certificates:
  issuer:
    certificate_file: "/etc/certpouch/ca/issuer.pem"
    private_key_file: "/etc/certpouch/secrets/issuer.key"
    chain_file: "/etc/certpouch/ca/chain.pem"
  trust_ca_file: "/etc/certpouch/ca/roots.pem"
  store_dir: "/var/lib/certpouch/certificates"
  validity: "720h"
  renew_before: "168h"
distribution:
  listen: "192.0.2.53:8443"
  tls:
    certificate_file: "/etc/certpouch/tls/server.pem"
    private_key_file: "/etc/certpouch/secrets/server.key"
  clients:
    - id: "docker-01"
      enabled: true
      token_hash_file: "/etc/certpouch/tokens/docker-01.sha256"
