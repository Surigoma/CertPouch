name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to rebuild, or leave blank to only package
        type: string
        required: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      commit: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  package:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Select build ref
        id: target
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag || inputs.release_tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Expected a release tag such as v0.1.0"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - name: Verify source
        run: |
          if [[ -f Taskfile.yml ]]; then
            task verify
          else
            # Rebuilding an existing release can check out a tag that predates the Taskfile.
            go vet ./...
            go test -race ./...
          fi
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Package Linux binaries
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          if [[ -f Taskfile.yml ]]; then
            task release:package RELEASE_VERSION="${RELEASE_TAG:-dev}"
          else
            bash scripts/package-release.sh dist "${RELEASE_TAG:-dev}"
          fi
      - name: Verify packaged binaries
        id: verify
        env:
          RELEASE_COMMIT: ${{ needs.release-please.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          if [[ -n "$RELEASE_COMMIT" && "$commit" != "$RELEASE_COMMIT" ]]; then
            echo "::error::Checked-out tag differs from the commit reported by Release Please"
            exit 1
          fi
          if [[ -f Taskfile.yml ]]; then
            task release:verify RELEASE_COMMIT="$commit" RELEASE_VERSION="${RELEASE_TAG:-dev}"
          elif [[ -f cmd/certpouch/update.go ]]; then
            # The standalone updater introduced the verifier's version argument.
            bash scripts/verify-release.sh dist "$commit" "${RELEASE_TAG:-dev}"
          else
            bash scripts/verify-release.sh dist "$commit"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certpouch-release
          path: dist
          if-no-files-found: error

  attach:
    if: needs.package.outputs.tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.package.outputs.tag }}
          persist-credentials: false
      - name: Attach verified artifacts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          VERIFIED_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$VERIFIED_COMMIT" ]]; then
            echo "::error::Tag $RELEASE_TAG differs from the commit used to verify the artifacts"
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG must exist and be a draft"
            exit 1
          fi
          gh run download "$GITHUB_RUN_ID" --name certpouch-release --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          gh release upload "$RELEASE_TAG" --clobber \
            dist/certpouch-linux-amd64.tar.gz dist/certpouch-linux-arm64.tar.gz dist/SHA256SUMS
      - name: Publish verified stable release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft,isPrerelease,assets --jq '
            select(.isDraft and (.isPrerelease | not))
            | select(([.assets[] | select(.state == "uploaded") | .name] | sort)
                == ["SHA256SUMS", "certpouch-linux-amd64.tar.gz", "certpouch-linux-arm64.tar.gz"])
            | .databaseId
          ')
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Release $RELEASE_TAG is not a stable draft with all verified assets attached"
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy --jq .html_url
